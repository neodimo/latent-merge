name: Build UI executables

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - bert/phase1-scaffold
      - gonzo/ui-pctnet-build
    paths:
      - ".github/workflows/build-ui-executables.yml"
      - "configs/**"
      - "core/**"
      - "models/**"
      - "requirements.txt"
      - "scripts/**"
      - "ui/**"
  pull_request:
    paths:
      - ".github/workflows/build-ui-executables.yml"
      - "configs/**"
      - "core/**"
      - "models/**"
      - "requirements.txt"
      - "scripts/**"
      - "ui/**"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux executable
            os: ubuntu-latest
            artifact: latent-merge-ui-linux
            executable: latent-merge-ui
            data_sep: ":"
          - name: Windows executable
            os: windows-latest
            artifact: latent-merge-ui-windows
            executable: latent-merge-ui.exe
            data_sep: ";"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pyinstaller>=6'
          python -m pip install opencv-python-headless easydict albumentations einops
          # Install CPU torch FIRST -- this satisfies torch deps for everything else.
          # Linux: CPU torch keeps the distributable ~300-500 MB instead of ~2.5 GB.
          # Windows: CPU torch since windows-latest has no NVIDIA driver.
          python -m pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu
          # kornia requires torch but we already have CPU torch. Use --no-deps to
          # prevent it from pulling in a duplicate CUDA torch from PyPI.
          python -m pip install --no-deps kornia kornia_rs
          # tensorboard may also drag in torch; install after CPU torch is present.
          python -m pip install --no-cache-dir tensorboard

      - name: Product smoke
        shell: bash
        run: |
          python cli/run_phase1.py \
            --config configs/phase1_pctnet.json \
            --output-dir runs/ci_pctnet_smoke
          python scripts/assert_harmonization_output.py \
            --job runs/ci_pctnet_smoke/job.json \
            --cg fixtures/golden_synthetic_001/cg_rgba.png

      - name: Build executable
        shell: bash
        run: >
          pyinstaller
          --clean
          --onefile
          --name latent-merge-ui
          --add-data "ui/index.html${{ matrix.data_sep }}ui"
          --add-data "ui/app.css${{ matrix.data_sep }}ui"
          --add-data "ui/app.js${{ matrix.data_sep }}ui"
          --add-data "ui/icon.png${{ matrix.data_sep }}ui"
          --add-data "configs${{ matrix.data_sep }}configs"
          --add-data "core${{ matrix.data_sep }}core"
          --add-data "models${{ matrix.data_sep }}models"
          --hidden-import=torch
          --hidden-import=torchvision
          --hidden-import=torchvision.transforms
          --hidden-import=torch.nn
          --hidden-import=torch.nn.functional
          --hidden-import=cv2
          --hidden-import=kornia
          --hidden-import=kornia_rs
          --hidden-import=albumentations
          --hidden-import=easydict
          --hidden-import=einops
          --hidden-import=einops.layers
          --hidden-import=einops.layers.torch
          ui/local_app.py

      - name: Smoke executable
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            "./dist/${{ matrix.executable }}" --help
          else
            chmod +x "./dist/${{ matrix.executable }}"
            "./dist/${{ matrix.executable }}" --help
          fi

      - name: Smoke executable API output
        shell: bash
        run: |
          "./dist/${{ matrix.executable }}" --host 127.0.0.1 --port 7865 &
          APP_PID=$!
          cleanup() {
            kill "$APP_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          python - <<'PY'
          import time
          import urllib.request

          deadline = time.time() + 60
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen("http://127.0.0.1:7865/api/gpus", timeout=2) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(1)
          raise SystemExit("UI executable did not become ready")
          PY

          HTTP_STATUS=$(curl --silent --show-error \
            --write-out "%{http_code}" \
            --output runs/ui_executable_smoke.json \
            -F cg=@fixtures/golden_synthetic_001/cg_rgba.png \
            -F plate=@fixtures/golden_synthetic_001/plate_rgb.png \
            -F alpha=@fixtures/golden_synthetic_001/alpha.png \
            -F gpu=cpu \
            http://127.0.0.1:7865/api/run)
          cat runs/ui_executable_smoke.json
          test "$HTTP_STATUS" = "200"

          # Smoke the UI asset paths (Windows onefile bug: APP_DIR must point to ui/ subdir)
          HTTP_ROOT=$(curl --silent --show-error --write-out "%{http_code}" --output /dev/null http://127.0.0.1:7865/)
          test "$HTTP_ROOT" = "200"
          HTTP_CSS=$(curl --silent --show-error --write-out "%{http_code}" --output /dev/null http://127.0.0.1:7865/app.css)
          test "$HTTP_CSS" = "200"
          HTTP_JS=$(curl --silent --show-error --write-out "%{http_code}" --output /dev/null http://127.0.0.1:7865/app.js)
          test "$HTTP_JS" = "200"

          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("runs/ui_executable_smoke.json").read_text())
          job_url = payload["job_json"]
          if not job_url.startswith("/file?path="):
              raise SystemExit(f"unexpected job URL: {job_url}")
          Path("runs/ui_executable_smoke_job_path.txt").write_text(job_url.split("=", 1)[1] + "\n")
          PY

          python scripts/assert_harmonization_output.py \
            --job "$(cat runs/ui_executable_smoke_job_path.txt)" \
            --cg fixtures/golden_synthetic_001/cg_rgba.png

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.executable }}
          if-no-files-found: error
